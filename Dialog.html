<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body { font-family: Arial, sans-serif; font-size: 13px; margin: 10px; }
    table { border-collapse: collapse; width: 100%; }
    th { text-align: left; font-size: 12px; padding: 4px; background: #f1f3f4; }
    td { padding: 3px; }
    input[type=text], input[type=number] {
      width: 100%; box-sizing: border-box; padding: 4px; font-size: 13px;
    }
    .qty-col { width: 70px; }
    .berat-col { width: 90px; }
    .del-col { width: 30px; text-align: center; }
    .del-btn {
      cursor: pointer; color: #c00; font-weight: bold; border: none; background: none; font-size: 14px;
    }
    #addRowBtn {
      margin-top: 8px; padding: 6px 12px; cursor: pointer;
    }
    .btn-row {
      margin-top: 14px; text-align: right;
    }
    .btn-row button {
      padding: 7px 16px; margin-left: 6px; cursor: pointer;
    }
    #submitBtn { background: #1a73e8; color: white; border: none; border-radius: 4px; }
    #status { margin-top: 8px; font-size: 12px; color: #555; }
    .hint { font-size: 11px; color: #888; }
  </style>
</head>
<body>

  <table id="rowsTable">
    <thead>
      <tr>
        <th>Item</th>
        <th>HTS Code</th>
        <th class="qty-col">Qty</th>
        <th class="berat-col">Berat (kg)</th>
        <th>Pick Slip <span class="hint">(cth: 1 atau 1,2,3)</span></th>
        <th class="del-col"></th>
      </tr>
    </thead>
    <tbody id="rowsBody">
    </tbody>
  </table>

  <button id="addRowBtn" onclick="addRow()">+ Add Row</button>

  <div id="status"></div>

  <div class="btn-row">
    <button onclick="google.script.host.close()">Cancel</button>
    <button id="submitBtn" onclick="submitForm()">Submit</button>
  </div>

  <script>
    var MAX_ROWS = 7;

    function addRow() {
      var body = document.getElementById('rowsBody');
      if (body.children.length >= MAX_ROWS) {
        setStatus('Maksimum ' + MAX_ROWS + ' baris sahaja.');
        return;
      }
      var tr = document.createElement('tr');
      tr.innerHTML =
        '<td><input type="text" class="item"></td>' +
        '<td><input type="text" class="hts"></td>' +
        '<td><input type="text" class="qty"></td>' +
        '<td><input type="number" step="0.1" class="berat"></td>' +
        '<td><input type="text" class="pickSlip"></td>' +
        '<td class="del-col"><button class="del-btn" onclick="delRow(this)">✕</button></td>';
      body.appendChild(tr);
    }

    function delRow(btn) {
      var body = document.getElementById('rowsBody');
      if (body.children.length <= 1) return; // keep at least 1 row
      btn.closest('tr').remove();
    }

    function setStatus(msg) {
      document.getElementById('status').innerText = msg;
    }

    function submitForm() {
      var trs = document.querySelectorAll('#rowsBody tr');
      var rows = [];
      trs.forEach(function (tr) {
        var item = tr.querySelector('.item').value.trim();
        var hts = tr.querySelector('.hts').value.trim();
        var qty = tr.querySelector('.qty').value.trim();
        var berat = tr.querySelector('.berat').value.trim();
        var pickSlip = tr.querySelector('.pickSlip').value.trim();
        // skip fully empty rows
        if (item || hts || qty || berat || pickSlip) {
          rows.push({ item: item, hts: hts, qty: qty, berat: berat, pickSlip: pickSlip });
        }
      });

      if (rows.length === 0) {
        setStatus('Sila isi sekurang-kurangnya satu baris.');
        return;
      }

      setStatus('Menghantar...');
      document.getElementById('submitBtn').disabled = true;

      google.script.run
        .withSuccessHandler(function (msg) {
          setStatus(msg);
          setTimeout(function () { google.script.host.close(); }, 900);
        })
        .withFailureHandler(function (err) {
          setStatus('Ralat: ' + err.message);
          document.getElementById('submitBtn').disabled = false;
        })
        .submitRows(rows);
    }

    // Start with 1 row visible
    addRow();
  </script>
</body>
</html>
